<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copper Dex</title><link rel="stylesheet" href="style.css"></head><body><div id="scaler"><div class="shadow"></div><div id="device" class="device"><section class="half left"><div class="head"><div class="orb animated-orb"><i class="orb-sweep"></i><i class="orb-spark"></i></div><div class="led"></div><div class="led yellow"></div><div class="led green"></div><div class="trainer">Trainer Copper<div id="clock" class="clock"></div></div></div><div class="screen-frame cut-frame"><div class="screen"><div class="preview"><img id="previewIcon" class="app-art" alt=""><h1 id="previewName">Copper Dex</h1><p>Press OK to open</p></div></div></div><div class="foot"><div class="credit">Designed by<br>Copper the Husbear</div><div class="speaker"><i></i><i></i><i></i></div></div></section><section class="half right"><div class="face"><div class="head buttons"><button class="system" id="settings" aria-label="Settings">⚙</button><button class="system" id="wifi" aria-label="Wi-Fi">⌁</button><button class="system" id="inputs" aria-label="Inputs">▣</button></div><div class="screen-frame"><div class="screen"><div id="appgrid" class="app-grid"></div></div></div><div class="foot"><div class="greenbar"></div><div class="dpad">✚</div></div></div><div class="lid"><div class="lid-module"><div class="orb animated-orb cover-orb"><i class="orb-sweep"></i><i class="orb-spark"></i></div><div class="cover-lights"><i></i><i></i><i></i></div></div><div class="cover-brand">Copper</div><div class="cover-line"></div><div class="cover-hint">PRESS OK TO OPEN</div></div></section><div class="hinge"></div><div class="hinge second"></div></div><div id="status" class="status" aria-live="polite"></div><div id="launch-shade" aria-hidden="true"></div><div id="settings-overlay" class="settings-overlay" hidden><div class="settings-shell"><div class="settings-title">COPPER DEX <span>SETTINGS</span></div><div class="settings-sub">SYSTEM CONSOLE / TRAINER COPPER</div><div id="settings-options" class="settings-options"></div><div class="settings-tip">D-PAD TO NAVIGATE · OK TO SELECT · BACK TO EXIT</div></div></div><div id="demo"></div><button id="replay">Replay opening</button></div><script src="app.js"></script></body></html>
