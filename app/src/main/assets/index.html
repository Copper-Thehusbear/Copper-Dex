<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copper Dex</title>
<style>
:root{font-family:system-ui,sans-serif;background:#0b1426;color:#8fe9ff}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#173968,#0b1426 70%);height:100vh}.stage{position:absolute;left:50%;top:50%;width:1760px;height:940px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center}.dex{display:flex;position:absolute;inset:20px;filter:drop-shadow(0 35px 35px #0009);perspective:2500px;animation:arrive 1.2s ease both}@keyframes arrive{from{opacity:0;transform:translateY(75px) rotateX(8deg)}to{opacity:1;transform:translateY(0) rotateX(0)}}.panel{position:relative;flex:1;background:linear-gradient(155deg,#f0524f,#cf2d2d 46%,#951b1b);border:10px solid #17181c;padding:34px;border-radius:50px 9px 9px 50px;box-shadow:inset 0 5px #ffb4ac55,inset 0 -14px 18px #50000077}.right{border-radius:9px 50px 50px 9px;animation:open 1.4s .3s cubic-bezier(.2,.7,.2,1) both;transform-origin:left center}@keyframes open{from{transform:rotateY(-95deg)}to{transform:rotateY(0)}}.head{height:125px;display:flex;align-items:center;gap:14px}.orb{width:80px;height:80px;border:7px solid #fff;border-radius:50%;background:radial-gradient(circle at 30% 25%,#defaff,#25a3e6 45%,#0c488d);box-shadow:0 0 0 5px #17181c,0 0 30px #59dfff99}.led{height:23px;width:23px;border:4px solid #17181c;border-radius:50%;background:#ffcb05;box-shadow:0 0 13px #ffd600}.trainer{margin-left:auto;text-align:right;color:white;font-weight:700;font-size:29px}.clock{font-size:39px}.screen-frame{background:linear-gradient(#fffaf0,#d7d3c9);padding:22px;border:8px solid #17181c;border-radius:26px 26px 26px 64px;height:635px;box-shadow:inset 0 5px #fff,8px 10px #0005}.right .screen-frame{border-radius:26px 26px 64px 26px}.screen{height:100%;border:7px solid #090d14;border-radius:15px;background:radial-gradient(circle at 30% 5%,#104071,#06172e 75%);box-shadow:inset 0 0 45px #5ce1ff33;overflow:hidden;position:relative}.screen:after{content:'';pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff06 0 2px,transparent 2px 7px)}.preview{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:15px}.preview img{height:180px;width:180px;object-fit:contain;filter:drop-shadow(0 0 20px #5ce1ff66)}.preview h1{font-size:70px;margin:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}.preview p{font-size:29px;color:#d6f3fb;margin:0}.controls{height:95px;display:flex;align-items:center;justify-content:flex-end;gap:15px}button{cursor:pointer;border:6px solid #17181c;border-radius:50%;width:72px;height:72px;background:radial-gradient(circle at 25% 20%,#fff,#9da8b3);font-size:31px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:27px;height:100%;grid-template-rows:repeat(3,1fr)}.tile{border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:4px solid transparent;min-width:0}.tile.sel{border-color:#ffcb05;background:#ffcb0527;box-shadow:0 0 28px #ffcb0580}.tile img{height:90px;width:90px;object-fit:contain;border-radius:14px}.tile span{color:#e9f9ff;font-size:21px;font-weight:700;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.foot{height:105px;display:flex;align-items:center;justify-content:space-between}.credit{color:white;font-size:24px;font-weight:700}.dpad{font-size:100px;color:#242930;line-height:1;text-shadow:2px 2px #a1abb5}.empty{font-size:32px;grid-column:span 4;align-self:center;text-align:center}
</style></head><body>
<div class="stage" id="stage"><div class="dex">
<section class="panel"><header class="head"><div class="orb"></div><div class="led"></div><div class="led" style="background:#ff5252"></div><div class="led" style="background:#4caf50"></div><div class="trainer">Trainer Copper<div class="clock" id="clock"></div></div></header><div class="screen-frame"><div class="screen"><div class="preview"><img id="previewIcon" alt=""><h1 id="previewName">Copper Dex</h1><p>Press OK to open</p></div></div></div><footer class="foot"><span class="credit">Designed by<br>Copper the Husbear</span><span class="led" style="width:50px;height:50px"></span></footer></section>
<section class="panel right"><header class="head" style="justify-content:flex-end"><button id="settings" title="Settings">⚙</button><button id="wifi" title="Wi-Fi">⌁</button><button id="inputs" title="Inputs">▣</button></header><div class="screen-frame"><div class="screen"><div class="grid" id="grid"></div></div></div><footer class="foot"><div style="background:#51b360;border:5px solid #17181c;width:180px;height:47px;border-radius:12px"></div><div class="dpad">✚</div></footer></section>
</div></div>
<script>
const demo=[{name:"Netflix",pkg:""},{name:"YouTube",pkg:""},{name:"Prime Video",pkg:""},{name:"Disney+",pkg:""},{name:"Spotify",pkg:""},{name:"Plex",pkg:""}];let apps=[],focus=0,page=0;
function fit(){document.getElementById('stage').style.setProperty('--scale',Math.min(innerWidth/1820,innerHeight/985))}addEventListener('resize',fit);fit();
function time(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'  '+d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}time();setInterval(time,30000);
try{apps=JSON.parse(window.CopperDex?CopperDex.apps():'[]')}catch(e){apps=[]}if(!apps.length)apps=demo;
function draw(){const grid=document.getElementById('grid');grid.textContent='';const list=apps.slice(page*12,page*12+12);list.forEach((app,i)=>{const tile=document.createElement('div');tile.className='tile'+(focus===page*12+i?' sel':'');if(app.icon){const img=document.createElement('img');img.src=app.icon;tile.append(img)}else{const square=document.createElement('div');square.style.cssText='width:90px;height:90px;border:3px dashed #8fe9ff;border-radius:16px;display:grid;place-items:center';square.textContent=app.name[0];tile.append(square)}const label=document.createElement('span');label.textContent=app.name;tile.append(label);tile.addEventListener('click',()=>{focus=page*12+i;draw();launch()});grid.append(tile)});const a=apps[focus];if(a){document.getElementById('previewName').textContent=a.name;const icon=document.getElementById('previewIcon');icon.src=a.icon||'';icon.style.visibility=a.icon?'visible':'hidden'}}
function launch(){if(apps[focus]&&apps[focus].pkg&&window.CopperDex)CopperDex.open(apps[focus].pkg)}
window.copperKey=function(key){if(key==='ok'){launch();return}const col=focus%4;let next=focus;if(key==='left'&&col>0)next--;if(key==='right'&&col<3)next++;if(key==='up')next-=4;if(key==='down')next+=4;if(next>=0&&next<apps.length){focus=next;page=Math.floor(focus/12);draw()}};
window.copperBack=function(){focus=0;page=0;draw()};
['settings','wifi','inputs'].forEach(id=>document.getElementById(id).addEventListener('click',()=>{if(window.CopperDex)CopperDex[id]()}));document.addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok'}[e.key];if(k){e.preventDefault();window.copperKey(k)}});draw();
</script></body></html>
