plugins { id 'com.android.application' }
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
android {
 namespace 'com.copper.dex'
 compileSdk 34
 defaultConfig { applicationId 'com.copper.dex'; minSdk 23; targetSdk 28; versionCode 100 + runNumber; versionName "0.4.${runNumber}" }
 signingConfigs {
  debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
