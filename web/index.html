<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Shopee Afl Ops</title>
    <style>
      /* สไตล์ของหน้าจอ fallback — inline เพราะถ้า CSS bundle โหลดไม่ได้ ก็ยังต้องอ่านออก */
      #boot {
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 28px 20px; max-width: 46ch; margin: 0 auto; color: #14171c;
      }
      #boot h1 { font-size: 17px; margin: 0 0 8px; }
      #boot p { margin: 0 0 10px; color: #6b7280; }
      #boot pre {
        white-space: pre-wrap; word-break: break-word; font-size: 12.5px;
        background: #f0f2f5; border: 1px solid #e2e5ea; border-radius: 8px;
        padding: 10px; color: #b3261e; margin: 10px 0 0;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1115; }
        #boot { color: #e8eaed; }
        #boot p { color: #9aa3b0; }
        #boot pre { background: #1e222a; border-color: #2a2f39; color: #f87171; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Vue เขียนทับตรงนี้ตอน mount สำเร็จ ถ้ายังเห็นข้อความนี้แปลว่าแอปไม่ได้เริ่ม -->
      <div id="boot">
        <h1>กำลังเปิด…</h1>
        <p>ถ้าค้างอยู่ตรงนี้เกิน 10 วินาที แปลว่าแอปเริ่มไม่ได้</p>
      </div>
    </div>

    <script>
      // จอขาวไม่บอกอะไรเลย — ดักไว้แล้วพิมพ์สาเหตุลงหน้าจอแทน
      (function () {
        var shown = false;
        function report(title, detail) {
          if (shown) return;
          var boot = document.getElementById('boot');
          if (!boot) return;              // Vue mount สำเร็จแล้ว ไม่ต้องยุ่ง
          shown = true;
          boot.innerHTML =
            '<h1>' + title + '</h1>' +
            '<p>ส่งข้อความข้างล่างนี้ให้ Claude ได้เลย</p>' +
            '<pre>' + String(detail).replace(/[<>&]/g, function (c) {
              return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
            }) + '</pre>';
        }

        // อาการเฉพาะ: เสิร์ฟโฟลเดอร์ซอร์สแทน dist → เบราว์เซอร์เจอ import 'vue' ดิบๆ
        function isRawSource(msg) {
          return /does not resolve to a valid URL|Failed to resolve module|bare specifier|Relative references must start/i.test(msg);
        }

        window.addEventListener('error', function (e) {
          if (e.target && e.target.tagName === 'SCRIPT') {
            report('โหลดไฟล์โปรแกรมไม่ได้', 'โหลดไม่สำเร็จ: ' + (e.target.src || '(ไม่ทราบ)'));
          } else if (isRawSource(e.message || '')) {
            report('deploy ผิดโฟลเดอร์',
              'เว็บนี้กำลังเสิร์ฟโค้ดต้นฉบับแทนไฟล์ที่ build แล้ว\n' +
              'ต้องชี้ assets ไปที่ web/dist ไม่ใช่ web/\n\n' + (e.message || ''));
          } else {
            report('แอปพัง', (e.message || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          report('แอปพัง', (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason));
        });

        setTimeout(function () {
          report('แอปเริ่มไม่ได้', 'ไม่มี error แต่หน้าจอไม่ขึ้นภายใน 10 วินาที\n' +
            'UA: ' + navigator.userAgent);
        }, 10000);
      })();
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
