name: weekly-backup

# Supabase free tier ไม่มี backup ให้ และ product_snapshots สร้างใหม่ไม่ได้ตลอดกาล
on:
  schedule:
    - cron: '0 20 * * 0'   # อาทิตย์ 03:00 เวลาไทย
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump
        run: |
          STAMP=$(date -u +%Y%m%d)
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" --data-only -f dump.sql
          gzip -9 dump.sql
          mv dump.sql.gz "backup-${STAMP}.sql.gz"
          ls -lh backup-*.sql.gz

      # สำเนา 1: artifact — กู้ได้ทันที ไม่ต้องตั้งอะไรเพิ่ม
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql.gz
          retention-days: 90

      # สำเนา 2: R2 ถาวร — ข้ามเองถ้ายังไม่ได้ตั้ง secret
      - name: Upload to R2
        if: env.R2_KEY != ''
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
        run: |
          aws s3 cp backup-*.sql.gz "s3://${{ secrets.R2_BUCKET }}/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
