name: daily-ingest

on:
  schedule:
    # 23:00 UTC = 06:00 เวลาไทย (Asia/Bangkok = UTC+7)
    # GitHub Actions cron ดีเลย์ได้ 5–30 นาทีตอน runner แน่น — ไม่กระทบ snapshot รายวัน
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'ดึง conversions ย้อนหลังกี่วัน'
        default: '7'

concurrency:
  group: daily-ingest
  cancel-in-progress: false   # ห้ามยกเลิกงานเขียน DB กลางคัน

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOPEE_APP_ID:        ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET:        ${{ secrets.SHOPEE_SECRET }}
      SHOPEE_ENDPOINT:      https://open-api.affiliate.shopee.co.th/graphql
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      WATCH_KEYWORDS:       ${{ vars.WATCH_KEYWORDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund

      # snapshot ก่อนเสมอ — ข้อมูลนี้สร้างย้อนหลังไม่ได้
      - name: Snapshot products
        run: node scripts/ingest-products.js

      # ถึงตัวบนพัง ตัวนี้ก็ยังต้องรัน
      - name: Ingest conversions
        if: always()
        run: node scripts/ingest-conversions.js --days=${{ inputs.backfill_days || 7 }}
