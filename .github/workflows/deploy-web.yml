name: deploy-web

# deploy หน้าเว็บขึ้น Cloudflare อัตโนมัติทุกครั้งที่แก้โค้ดใน web/
# ไม่ต้องกดอะไรใน dashboard ของ Cloudflare เลย
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ล้มตั้งแต่ต้นพร้อมบอกว่าขาดอะไร ดีกว่าปล่อยให้ build เสร็จแล้วได้เว็บที่ต่อ DB ไม่ติด
      - name: เช็คว่าใส่ secret ครบ
        env:
          CF_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_URL:    ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY:    ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$SB_URL" ]   && missing="$missing VITE_SUPABASE_URL"
          [ -z "$SB_KEY" ]   && missing="$missing VITE_SUPABASE_ANON_KEY"
          # CLOUDFLARE_ACCOUNT_ID ไม่บังคับ — ถ้ามีบัญชี Cloudflare เดียว wrangler หาเอง
          # ต้องใส่เฉพาะตอน token เข้าถึงได้หลายบัญชี ซึ่งจะ error บอกเองตอน deploy
          [ -z "$CF_ACCT" ] && echo "::notice::ไม่ได้ใส่ CLOUDFLARE_ACCOUNT_ID — ให้ wrangler หาบัญชีเอง"
          if [ -n "$missing" ]; then
            echo "::error::ยังไม่ได้ใส่ secret เหล่านี้ →$missing"
            echo "ใส่ที่ Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          case "$SB_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::VITE_SUPABASE_URL ต้องเป็น https://xxxxx.supabase.co (ได้มา: $SB_URL)"; exit 1 ;;
          esac
          echo "secret ครบ"

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Build
        working-directory: web
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TIKTOK_FN_URL:     ${{ secrets.VITE_TIKTOK_FN_URL }}
          VITE_APP_TOKEN:         ${{ secrets.VITE_APP_TOKEN }}
        run: npm run build

      # ยืนยันว่าคีย์ถูกฝังเข้า bundle จริง และไม่ใช่ service_role
      - name: ตรวจ bundle ก่อน deploy
        working-directory: web
        run: |
          if grep -rql "service_role" dist/; then
            echo "::error::เจอคำว่า service_role ใน bundle — คุณใส่คีย์ผิดตัว หยุด deploy"
            exit 1
          fi
          if ! grep -rql "supabase.co" dist/assets/; then
            echo "::error::ไม่เจอ Supabase URL ใน bundle — env var ไม่เข้าตอน build"
            exit 1
          fi
          echo "bundle ผ่าน"

      # wrangler.jsonc มี build.command อยู่ → wrangler จะ build ซ้ำอีกรอบ
      # ต้องส่ง VITE_* ให้ step นี้ด้วย ไม่งั้น build รอบสองจะไม่มีคีย์ Supabase
      # แล้วได้เว็บที่เปิดได้แต่ต่อฐานข้อมูลไม่ติด
      - uses: cloudflare/wrangler-action@v3
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TIKTOK_FN_URL:     ${{ secrets.VITE_TIKTOK_FN_URL }}
          VITE_APP_TOKEN:         ${{ secrets.VITE_APP_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
